name: 'verify pr'

on:
    pull_request:
        types: ['opened', 'labeled', 'reopened', 'synchronize']

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow}}-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

jobs:
    verify-and-build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Lets the coverage report post its PR comment
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install
              # No `--ignore-scripts`: postinstall generates the translations and fetches the TS types (needs the dev server) that lint and tests need
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Unit tests
              id: unit-tests
              run: pnpm test:coverage

            - name: Coverage report
              # Also report when tests fail, but not when an earlier step failed and no coverage exists
              if: always() && steps.unit-tests.outcome != 'skipped'
              uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2.13.2

            - name: Build
              run: pnpm d2-app-scripts build

    # Beside verify-and-build, one job per browser, so the browsers add no
    # time to the run
    component-tests:
        name: component tests (${{ matrix.browser }})
        runs-on: ubuntu-latest
        strategy:
            # A failure in one browser still lets the other report
            fail-fast: false
            matrix:
                browser: [chrome, firefox]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install
              # As above: postinstall fetches the TS types the tests import
              run: pnpm install --frozen-lockfile

            - name: Cypress component tests
              id: component-tests
              uses: cypress-io/github-action@18016a55674bd02cabf197de5762a1710cb5577c # v7.4.9
              with:
                  # Dependencies and the Cypress binary come from the install step
                  install: false
                  component: true
                  browser: ${{ matrix.browser }}
                  # Results stay in the job log; nothing goes to Cypress Cloud
                  record: false

            - name: Cypress screenshots
              if: failure() && steps.component-tests.outcome == 'failure'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: cypress-screenshots-${{ matrix.browser }}
                  path: cypress/screenshots
                  if-no-files-found: ignore
