name: 'verify pr'

on:
    pull_request:
        types: ['opened', 'labeled', 'reopened', 'synchronize']

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow}}-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

jobs:
    verify-and-build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Lets the coverage report post its PR comment
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install
              # No `--ignore-scripts`: postinstall generates the translations and fetches the TS types (needs the dev server) that lint and tests need
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Unit tests
              id: unit-tests
              run: pnpm test:coverage

            - name: Coverage report
              # Also report when tests fail, but not when an earlier step failed and no coverage exists
              if: always() && steps.unit-tests.outcome != 'skipped'
              uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0

            - name: Build
              run: pnpm d2-app-scripts build

    # Beside verify-and-build, one job per browser, so the browsers add no
    # time to the run
    component-tests:
        name: component tests (${{ matrix.browser }})
        runs-on: ubuntu-latest
        strategy:
            # A failure in one browser still lets the other report
            fail-fast: false
            matrix:
                browser: [chrome, firefox]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install
              # As above: postinstall fetches the TS types the tests import
              run: pnpm install --frozen-lockfile

            - name: Cypress component tests
              id: component-tests
              uses: cypress-io/github-action@789d836053c5ca389c2905fc0c9f2909da778c46 # v7.4.5
              with:
                  # Dependencies and the Cypress binary come from the install step
                  install: false
                  component: true
                  browser: ${{ matrix.browser }}
                  # Results stay in the job log; nothing goes to Cypress Cloud
                  record: false

            - name: Cypress screenshots
              if: failure() && steps.component-tests.outcome == 'failure'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: cypress-screenshots-${{ matrix.browser }}
                  path: cypress/screenshots
                  if-no-files-found: ignore
